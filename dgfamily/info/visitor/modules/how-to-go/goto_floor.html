<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>층별 안내</title>
    <style>
        /* 기본 스타일 리셋 및 투명 배경 설정 */
        html, body {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
            /* 핵심: iframe으로 삽입될 것을 대비해 배경을 투명하게 설정합니다. */
            background: transparent;
            
            /* 폰트 설정 */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
            
            /* 콘텐츠가 넘치는 것을 방지합니다. */
            overflow: hidden;
            
            /* 텍스트와 아이콘의 기본 색상을 설정합니다. (부모 페이지 배경에 따라 조정 필요) */
            color: #333; 
        }

        /* 콘텐츠를 수직/수평 중앙에 정렬하기 위한 컨테이너 */
        .container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            width: 100%;
            box-sizing: border-box;
            padding: 16px;
            gap: 20px; /* 아이콘과 텍스트 사이의 간격 */
        }

        /* 아이콘들을 담는 래퍼 */
        .icons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px; /* 아이콘 사이의 간격 */
        }

        /* SVG 아이콘 스타일 */
        .icon {
            width: 80px;
            height: 80px;
            /* 텍스트와 동일한 색상(color)을 사용하도록 fill을 currentColor로 설정 */
            fill: currentColor;
            opacity: 0.8;
        }

        /* 층수 안내 텍스트 스타일 */
        .floor-text {
            font-size: 2.2rem; /* 글꼴 크기 */
            font-weight: 600; /* 글꼴 굵기 */
            text-align: center;
            /* 단어가 길어질 경우 줄바꿈 처리 */
            word-break: keep-all; 
        }

        /* 모바일 화면 등 작은 화면에서 크기 조정 */
        @media (max-width: 400px) {
            .icon {
                width: 60px;
                height: 60px;
            }
            .floor-text {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 그래픽 섹션 -->
        <div class="icons">
            <!-- 엘리베이터 아이콘 (SVG) -->
            <svg class="icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM9.5 6c.83 0 1.5.67 1.5 1.5S10.33 9 9.5 9 8 8.33 8 7.5 8.67 6 9.5 6zm6.5 12.5l-4-3.5-4 3.5v-2.5h8v2.5zm0-3.5L12 8.5 7.5 15h9z"/>
            </svg>
            
            <!-- 계단 아이콘 (SVG) -->
            <svg class="icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M19 5v14H5V5h14m0-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-9 4H7v3h3V9zm3 3h-3v3h3v-3zm3 3h-3v3h3v-3zm3 3h-3v3h3v-3z"/>
            </svg>
        </div>

        <!-- 텍스트 섹션 (JavaScript로 내용이 채워짐) -->
        <div class="floor-text" id="floor-text-display">
            ...
        </div>
    </div>

    <script>
        // 페이지 로드 시 URL 파라미터를 읽어 텍스트를 설정합니다.
        window.onload = function() {
            try {
                // 1. 현재 URL에서 쿼리 파라미터를 가져옵니다.
                const urlParams = new URLSearchParams(window.location.search);
                
                // 2. 'floor'라는 이름의 파라미터 값을 가져옵니다.
                const floor = urlParams.get('floor');
                
                // 3. 텍스트를 표시할 DOM 요소를 찾습니다.
                const textElement = document.getElementById('floor-text-display');
                
                // 4. 'floor' 파라미터 값이 있는지 확인합니다.
                if (floor) {
                    // 값이 있으면: "n층으로 가세요"
                    textElement.textContent = floor + "층으로 가세요";
                } else {
                    // 값이 없으면: 기본 메시지
                    textElement.textContent = "층을 지정해주세요";
                }
            } catch (e) {
                // 오류 발생 시 콘솔에 로그를 남기고 기본 메시지를 표시합니다.
                console.error("Error getting URL parameter:", e);
                const textElement = document.getElementById('floor-text-display');
                if (textElement) {
                    textElement.textContent = "안내 로드 실패";
                }
            }
        };
    </script>

</body>
</html>
