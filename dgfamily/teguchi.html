<!DOCTYPE html>
<html lang="ko">

<head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>출구</title>
        <link rel="manifest" href="manifest.json">
        <meta name="theme-color" content="#000000">
        <style>
                /* 기본 스타일 및 글꼴 설정 */
                @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');

                body {
                        background-color: #000;
                        margin: 0;
                        overflow: hidden;
                        /* 애니메이션이 화면을 벗어날 때 스크롤바가 생기지 않도록 방지 */
                        font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto", "Oxygen", "Ubuntu", "Cantarell", "Fira Sans", "Droid Sans", "Helvetica Neue", sans-serif;
                        color: #39ff14;
                        /* 밝은 녹색 */
                }

                /* 중앙 '출구' 텍스트 스타일 */
                .exit-sign {
                        position: absolute;
                        top: 50%;
                        left: 50%;
                        transform: translate(-50%, -50%);
                        font-family: 'Pretendard', sans-serif;
                        font-size: 22.5vw;
                        /* 화면 너비에 따라 크기 조절 */
                        font-weight: 900;
                        color: #39ff14;
                        z-index: 10;
                }

                /* 매트릭스 화살표 기둥 컨테이너 */
                .matrix-column {
                        position: absolute;
                        top: 0;
                        width: 80px;
                        height: 100%;
                        overflow: hidden;
                        /* 컨테이너를 벗어나는 화살표 숨기기 */
                }

                /* 기둥 위치 설정 */
                .left {
                        left: 15px;
                }

                .right {
                        right: 15px;
                }

                /* 위로 스크롤되는 화살표 스트림 */
                .arrow-stream {
                        position: absolute;
                        width: 100%;
                        text-align: center;
                        line-height: 1.2;
                        font-size: 80px;
                        font-weight: 900;
                        animation: scrollUp 20s linear infinite;
                        /* 애니메이션 적용 */
                }

                /* 위로 올라가는 애니메이션 키프레임 */
                @keyframes scrollUp {
                        from {
                                transform: translateY(0%);
                        }

                        to {
                                transform: translateY(-50%);
                                /* 화살표 그룹 높이의 절반만큼 이동하여 끊김 없이 연결 */
                        }
                }

                /* 화면 꺼짐 방지용 유튜브 임베드 스타일 */
                .screen-wake-lock-iframe {
                        position: absolute;
                        top: 0;
                        left: 0;
                        width: 1px;
                        height: 1px;
                        opacity: 0;
                        pointer-events: none;
                        /* 비디오가 클릭되는 것을 방지 */
                }
        </style>
</head>

<body>
        <!-- 화면 꺼짐 방지를 위한 보이지 않는 유튜브 영상 -->
        <iframe class="screen-wake-lock-iframe"
                src="https://www.youtube.com/embed/AjWfY7SnMBI?autoplay=1&mute=1&loop=1&playlist=AjWfY7SnMBI&controls=0"
                frameborder="0" allow="autoplay; encrypted-media" allowfullscreen>
        </iframe>

        <!-- 중앙 출구 텍스트 -->
        <div class="exit-sign">출구</div>

        <!-- 왼쪽 화살표 기둥 -->
        <div class="matrix-column left">
                <div class="arrow-stream" id="left-stream"></div>
        </div>

        <!-- 오른쪽 화살표 기둥 -->
        <div class="matrix-column right">
                <div class="arrow-stream" id="right-stream"></div>
        </div>

        <script>
                // JavaScript를 사용하여 화면 높이를 채우는 화살표 생성
                document.addEventListener('DOMContentLoaded', () => {
                        const leftStream = document.getElementById('left-stream');
                        const rightStream = document.getElementById('right-stream');

                        // 화면 높이의 약 4배만큼 화살표를 생성하여 애니메이션이 끊기지 않게 함
                        // 화살표 폰트 크기(80px) * 줄 높이(1.2) = 96px
                        const arrowHeight = 80 * 1.2;
                        const arrowCount = Math.ceil(window.innerHeight / arrowHeight) * 4;

                        let arrows = '';
                        for (let i = 0; i < arrowCount; i++) {
                                arrows += '↑<br>';
                        }

                        // 생성된 화살표를 양쪽 기둥에 삽입
                        leftStream.innerHTML = arrows;
                        rightStream.innerHTML = arrows;

                        // 페이지 로드 시 전체화면으로 전환
                        goFullscreen();
                        // 화면 꺼짐 방지 기능 활성화
                        requestWakeLock();
                });

                // 전체화면 전환 함수
                function goFullscreen() {
                        const elem = document.documentElement;
                        if (document.fullscreenElement) return; // 이미 전체화면이면 실행 안함

                        if (elem.requestFullscreen) {
                                elem.requestFullscreen().catch(err => console.error(`Error attempting to enable full-screen mode: ${err.message} (${err.name})`));
                        } else if (elem.webkitRequestFullscreen) { /* Safari */
                                elem.webkitRequestFullscreen();
                        } else if (elem.msRequestFullscreen) { /* IE11 */
                                elem.msRequestFullscreen();
                        }
                }

                // 화면 꺼짐 방지 함수
                let wakeLock = null;
                async function requestWakeLock() {
                        if ('wakeLock' in navigator) {
                                try {
                                        wakeLock = await navigator.wakeLock.request('screen');
                                        wakeLock.addEventListener('release', () => {
                                                console.log('Screen Wake Lock released:', wakeLock.released);
                                        });
                                        console.log('Screen Wake Lock active.');
                                } catch (err) {
                                        console.error(`${err.name}, ${err.message}`);
                                }
                        }
                }

                // 더블 탭으로 전체화면 전환
                let lastTap = 0;
                document.addEventListener('touchend', function (event) {
                        const currentTime = new Date().getTime();
                        const tapLength = currentTime - lastTap;
                        if (tapLength < 300 && tapLength > 0) {
                                goFullscreen();
                                event.preventDefault();
                        }
                        lastTap = currentTime;
                });

                // 데스크탑용 더블 클릭으로 전체화면 전환
                document.addEventListener('dblclick', goFullscreen);

                if ('serviceWorker' in navigator) {
                  window.addEventListener('load', () => {
                    navigator.serviceWorker.register('sw.js').then(registration => {
                      console.log('ServiceWorker registration successful with scope: ', registration.scope);
                    }, err => {
                      console.log('ServiceWorker registration failed: ', err);
                    });
                  });
                }
        </script>

</body>

</html>
