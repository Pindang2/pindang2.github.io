<!-- This page is Instoduce pages for my temp projects -->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pindang2-Workspace</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">
    <div class="container mx-auto px-4 py-8">
        <h1 class="text-4xl font-bold text-center text-gray-800 mb-10">Pindang2's Workspace</h1>

        <div id="projects-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            <!-- Projects will be dynamically inserted here -->
        </div>
    </div>

    <script>
        const projects = [
            {
                title: "Live Jisin Viewer Collection",
                description: "A collection of live earthquake viewers.",
                link: "/mergedJisinViewer/index.html",
                color: "blue"
            },
            {
                title: "대구가정법원용 디스플레이 프로젝트",
                description: "출구 안내 디스플레이입니다.",
                link: "/dgfamily/teguchi.html",
                color: "green"
            }
            // Add more projects here in the future
        ];

        const projectsGrid = document.getElementById('projects-grid');

        projects.forEach(project => {
            const projectCard = `
                <div class="bg-white rounded-lg shadow-lg overflow-hidden">
                    <div class="p-6">
                        <h2 class="text-2xl font-bold text-gray-800 mb-2">${project.title}</h2>
                        <p class="text-gray-600 mb-4">${project.description}</p>
                        <a href="${project.link}" class="inline-block bg-${project.color}-500 hover:bg-${project.color}-600 text-white font-bold py-2 px-4 rounded">View Project</a>
                    </div>
                </div>
            `;
            projectsGrid.innerHTML += projectCard;
        });
    </script>
</body>

</html>
