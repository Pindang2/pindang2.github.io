<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pindang2-Workspace</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">
    <div class="container mx-auto px-4 py-8">
        <h1 class="text-4xl font-bold text-center text-gray-800 mb-10">Pindang2's Workspace</h1>

        <div id="projects-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            <!-- Projects will be dynamically inserted here -->
        </div>
    </div>

    <script>
        const projects = [
            {
                title: "Live Jisin Viewer Collection",
                description: "A collection of live earthquake viewers.",
                link: "/mergedJisinViewer/index.html",
                color: "blue"
            },
            {
                title: "대구가정법원 프로젝트",
                description: "대구가정법원 관련 프로젝트 모음입니다.",
                color: "green",
                subProjects: [
                    { name: "출구 안내 디스플레이", description: "출구 안내 디스플레이입니다.", link: "/dgfamily/teguchi.html" },
                    { name: "소년심판전25호 디스플레이", description: "대구가정법원 소년심판전25호 디스플레이 프로그램.", link: "/dgfamily/edu_before_justice.html" },
                    { name: "청사업무안내 (방문자용)", description: "대구가정법원/대구서부지원 방문자 안내판용 프로그램.", link: "/dgfamily/info/visitor/index.html" },
                    { name: "청사업무조회 (직원용)", description: "대구가정법원/대구서부지원 방문자를 응대하는 직원용 업무조회 프로그램.", link: "/dgfamily/info/employee/index.html" },
                    { name: "통합검색 (간단버전)", description: "자음 검색을 지원하는 간단한 통합검색 페이지.", link: "/dgfamily/info/employee/simple.html" }
                ]
            }
            // Add more projects here in the future
        ];

        const projectsGrid = document.getElementById('projects-grid');

        projects.forEach(project => {
            let contentHtml = '';
            if (project.subProjects) {
                contentHtml = project.subProjects.map(sub => `
                    <div class="flex items-center mb-3">
                        <a href="${sub.link}" class="flex-shrink-0 bg-${project.color}-500 hover:bg-${project.color}-600 text-white font-bold py-2 px-4 rounded text-center" style="min-width: 180px;">${sub.name}</a>
                        <p class="text-gray-600 ml-4">${sub.description}</p>
                    </div>
                `).join('');
            } else {
                contentHtml = `<a href="${project.link}" class="inline-block bg-${project.color}-500 hover:bg-${project.color}-600 text-white font-bold py-2 px-4 rounded">View Project</a>`;
            }

            const projectCard = `
                <div class="bg-white rounded-lg shadow-lg overflow-hidden">
                    <div class="p-6">
                        <h2 class="text-2xl font-bold text-gray-800 mb-2">${project.title}</h2>
                        <p class="text-gray-600 mb-4">${project.description}</p>
                        <div class="mt-4">
                            ${contentHtml}
                        </div>
                    </div>
                </div>
            `;
            projectsGrid.innerHTML += projectCard;
        });
    </script>
</body>

</html>
